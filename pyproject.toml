[project]
name = "gitstat"
version = "0.1.0"
description = "Git work stats: effort hours, activity, LOC, with a Textual TUI and HTML export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jeremy Champion", email = "jeremy@championops.com" }
]
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
gitstat = "gitstat.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
